<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별빛 탐험대 – 중3 별과 우주 퀴즈 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b22;--card:#111a47;--card2:#1a2564;--line:#2c3a85;--gold:#ffd54a;--mint:#7fffd4;--pink:#ff8fb1;--txt:#eef2ff;--sub:#a9b6e8;--good:#27c486;--bad:#ff5c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#1b2670 0%,#0a1034 45%,#050718 100%);color:var(--txt);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.65;min-height:100vh;font-size:15px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:14px 14px 90px}
h1,h2,h3,.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;margin:0}
h3{font-size:19px;margin:0 0 8px;color:var(--gold)}
p{margin:6px 0}
b{color:#fff}
.sub,.small{color:var(--sub);font-size:12.5px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.logo{font-size:24px;color:var(--gold);text-shadow:0 0 14px rgba(255,213,74,.5)}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700;color:var(--gold)}
.back{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:6px 12px;font-size:14px;cursor:pointer}
.lrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.lrow svg{flex:none;animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bubble{position:relative;background:#fff;color:#16204f;border-radius:16px;padding:10px 13px;font-weight:500;font-size:14px;flex:1}
.bubble b{color:#d6336c}
.bubble::before{content:'';position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.card{background:linear-gradient(160deg,var(--card),#0e1538);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:13px 16px;font:700 16px 'Noto Sans KR';color:#2a1d00;background:linear-gradient(180deg,#ffe27a,#ffb82e);box-shadow:0 4px 0 #b97a00;cursor:pointer;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b97a00}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:0 4px 0 #0b1233;border:1px solid var(--line)}
.btn.mint{background:linear-gradient(180deg,#9bffe0,#3fd6a5);box-shadow:0 4px 0 #1b8a69;color:#06382a}
.navrow{display:flex;gap:10px}.navrow .btn{flex:1}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots i{width:26px;height:6px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--gold)}
.map{position:relative;margin-top:6px}
.map::before{content:'';position:absolute;left:43px;top:30px;bottom:30px;border-left:2px dashed var(--line)}
.node{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin:0 0 12px;color:var(--txt);font:inherit;cursor:pointer}
.node:active{transform:scale(.98)}
.node.lock{opacity:.5;cursor:not-allowed}
.planet{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 30% 28%,var(--a),var(--b) 70%);box-shadow:0 0 22px var(--b),inset -6px -8px 14px rgba(0,0,0,.35)}
.ninfo{display:flex;flex-direction:column;line-height:1.35}
.ninfo small{color:var(--sub);font-size:11px;letter-spacing:.08em}
.ninfo b{font-family:'Jua';font-weight:400;font-size:19px}
.ninfo span{color:var(--sub);font-size:13px}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
canvas.cv{width:100%;height:auto;display:block;border-radius:12px;background:#050824}
.ctl{margin:10px 0 0}
.ctl label{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
input[type=range]{width:100%;accent-color:var(--gold);height:30px}
.read{background:#0a1036;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.read b{color:var(--mint)}
.formula{background:#0a1036;border-left:4px solid var(--gold);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:700}
ul.pts{padding-left:18px;margin:6px 0}
.hl{color:var(--mint);font-weight:700}
.opts{display:grid;gap:9px;margin-top:8px}
.opt{background:var(--card2);color:var(--txt);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:500 15px 'Noto Sans KR';text-align:left;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt.good{border-color:var(--good);background:#0f4a3a}
.opt.bad{border-color:var(--bad);background:#552038}
.qq{color:#fff;font-size:19px;line-height:1.5}
#fb{margin-top:10px}
#fb .ex{background:#0a1036;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.hearts{font-size:18px;letter-spacing:2px}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));transition:width .4s}
.center{text-align:center}
.bigstars{font-size:44px;color:var(--gold);letter-spacing:6px;text-shadow:0 0 18px rgba(255,213,74,.6)}
.icons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icons .ic{background:#0a1036;border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:12.5px}
.icons canvas{width:100%;border-radius:8px;display:block}
.icons b{display:block;color:var(--gold);font-size:14px;margin-top:3px}
.rank{position:relative;height:306px;margin-top:10px}
.row{position:absolute;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 10px;transition:top .9s cubic-bezier(.5,.1,.2,1)}
.row .rk{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2a1d00;font-weight:700;display:grid;place-items:center;font-size:13px;flex:none}
.row .nm{font-weight:700;min-width:70px}
.row .mg{color:var(--mint);font-weight:700;font-size:13px}
.row small{margin-left:auto;color:var(--sub);font-size:11px;text-align:right}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog button{padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--txt);font:700 13px 'Noto Sans KR';cursor:pointer;line-height:1.3}
.tog button.on{border-color:var(--gold);background:#3b3410}
.ladder{display:flex;justify-content:space-around;align-items:center;margin:10px 0;gap:8px;text-align:center}
.glow{width:84px;height:84px;border-radius:50%;margin:0 auto 4px;background:radial-gradient(circle,#fff 0 18%,#ffe27a 38%,rgba(255,200,50,.0) 70%)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sortbox canvas{width:100%;border-radius:12px;display:block}
.nm2{font-family:'Jua';font-size:20px;color:var(--gold);margin-top:6px}
ol.chk{list-style:none;padding:0;margin:8px 0}
ol.chk li{background:#0a1036;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
ol.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
ol.chk input{width:20px;height:20px;accent-color:var(--gold);margin-top:3px;flex:none}
code{background:#0a1036;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--mint)}
details{background:#0a1036;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
summary{cursor:pointer;font-weight:700;color:var(--gold)}
.chall{border:2px dashed var(--pink);border-radius:14px;padding:10px 12px;margin:10px 0}
.badge{display:inline-grid;place-items:center;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff3b0,#ffb82e 60%,#b97a00);font-size:64px;box-shadow:0 0 40px rgba(255,213,74,.7)}
.reset{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:12px;cursor:pointer;display:block;margin:18px auto 0}
.fl{display:block;font-weight:700;margin:8px 0}
.fl input{display:block;width:100%;margin-top:5px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#0a1036;color:#fff;font:500 16px 'Noto Sans KR'}
.fl input:focus{outline:0;border-color:var(--gold)}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chr{background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:8px 4px;color:var(--txt);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.35}
.chr b{font-family:'Jua';font-weight:400;font-size:17px;margin-top:2px}.chr span{font-size:12px;color:var(--sub)}
.chr.on{border-color:var(--gold);background:#3b3410;box-shadow:0 0 16px rgba(255,213,74,.4)}
.err{color:var(--bad);font-weight:700;min-height:20px;text-align:center}
.reward{background:linear-gradient(90deg,#4a3a00,#2a1f55);border:2px solid var(--gold);border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:700;text-align:center;animation:pop .5s}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.opt:disabled{color:var(--txt);cursor:not-allowed}
.stk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stk span{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:#0a1036;border:1px solid var(--line)}
.stk span.no{opacity:.25;filter:grayscale(1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{display:block;width:100%;margin-top:5px;padding:12px 10px;border-radius:12px;border:2px solid var(--line);background:#0a1036;color:#fff;font:500 16px 'Noto Sans KR'}
.dexc{background:linear-gradient(160deg,#1d2a74,#0e1538);border:2px solid var(--gold);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 0 14px rgba(255,213,74,.18)}
.dexc .dh{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.dexc .dh b{font-family:'Jua';font-weight:400;color:var(--gold);font-size:20px}
.dexc .dg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.dexc .dg span{background:#0a1036;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px;color:var(--mint);font-weight:700}
.dexc .nt{font-size:14px;color:#dfe6ff}
.del{background:none;border:1px solid var(--line);border-radius:10px;color:var(--sub);padding:3px 9px;cursor:pointer;font-size:13px}
textarea.ta{width:100%;height:150px;margin-top:8px;border-radius:12px;border:2px solid var(--line);background:#0a1036;color:#fff;padding:10px;font:13px/1.5 'Noto Sans KR'}
.srow{background:#0e1538;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer}
.srow.op{border-color:var(--gold);background:#141c4d}
.srow .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:5px;margin:6px 0 2px}
.sc{display:inline-grid;place-items:center;width:30px;height:24px;border-radius:7px;font-size:12px;font-style:normal;font-weight:700;background:#1f2a66;color:#8a97d8}
.sc.s1{background:#8b5a2b;color:#fff}.sc.s2{background:#9aa6c6;color:#10183f}.sc.s3{background:#ffd54a;color:#3a2a00}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.sg div{background:#0a1036;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.sg b{display:block;font-family:'Jua';font-weight:400;font-size:22px;color:var(--mint)}
.dtab{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}.dtab td,.dtab th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
input.sq{display:block;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#0a1036;color:#fff;font:500 15px 'Noto Sans KR';margin-bottom:6px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ---------- Firebase 설정 (공개되어도 안전한 웹 설정값. 비밀번호는 여기에 없어요) ---------- */
const FB_CONFIG={apiKey:"AIzaSyDyxXuWn9TKC7rgdEZczkXcchTQI6wD7eE",authDomain:"byeolbit-quest.firebaseapp.com",databaseURL:"https://byeolbit-quest-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"byeolbit-quest",storageBucket:"byeolbit-quest.firebasestorage.app",messagingSenderId:"791502433595",appId:"1:791502433595:web:67f69afc96171b01d31b1e"};
const TEACHER_EMAIL="mschoi1203@icedu.kr";   /* Firebase Authentication에 만든 교사 계정 이메일 (비밀번호는 Firebase에만 저장) */

/* ---------- 유틸 ---------- */
const app=document.getElementById('app');
const rnd=seed=>{let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const SAVE='starQuestV1';
let S={unlocked:1,stars:[0,0,0,0,0],final:false,profile:null,char:0,coins:0,stk:[],cards:[],qa:{},att:[0,0,0,0,0],resetSeen:0};
try{const v=JSON.parse(localStorage.getItem(SAVE));if(v&&v.stars)S=Object.assign(S,v);}catch(e){}
const save=()=>{try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}try{sync();}catch(e){}};

/* ---------- 배경 별 ---------- */
(function(){
  const cv=document.getElementById('bg'),c=cv.getContext('2d');let W,H,st=[];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;st=[];const r=rnd(11);for(let i=0;i<110;i++)st.push([r()*W,r()*H,r()*1.4+.3,r()*6.28,r()*1.5+.5]);}
  size();addEventListener('resize',size);
  function loop(t){c.clearRect(0,0,W,H);for(const s of st){c.globalAlpha=.35+.65*Math.abs(Math.sin(t/1000*s[4]+s[3]));c.fillStyle='#fff';c.beginPath();c.arc(s[0],s[1],s[2],0,7);c.fill();}c.globalAlpha=1;requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
})();

/* ---------- 캐릭터 ---------- */
function astro(m='normal',w=84){
  const E='#7fffd4';
  const eye=m==='happy'?`<path d="M43 52q6-8 12 0M65 52q6-8 12 0" stroke="${E}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`
   :m==='sad'?`<circle cx="49" cy="54" r="4.5" fill="${E}"/><circle cx="71" cy="54" r="4.5" fill="${E}"/><path d="M42 44l13 5M78 44l-13 5" stroke="${E}" stroke-width="2.6" stroke-linecap="round"/>`
   :`<circle cx="49" cy="52" r="5" fill="${E}"/><circle cx="71" cy="52" r="5" fill="${E}"/>`;
  const mouth=m==='happy'?`<path d="M50 63q10 11 20 0z" fill="${E}"/>`:m==='sad'?`<path d="M52 70q8-8 16 0" stroke="${E}" stroke-width="3" fill="none" stroke-linecap="round"/>`:`<path d="M52 64q8 7 16 0" stroke="${E}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const arms=m==='happy'?`<path d="M38 98 L20 78" stroke="#e8f0ff" stroke-width="10" stroke-linecap="round"/><path d="M82 98 L100 78" stroke="#e8f0ff" stroke-width="10" stroke-linecap="round"/>`
   :`<path d="M38 100 L24 112" stroke="#e8f0ff" stroke-width="10" stroke-linecap="round"/><path d="M82 100 L96 112" stroke="#e8f0ff" stroke-width="10" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 120 140" width="${w}" height="${w*140/120}" aria-label="우주인 루미">
  <line x1="60" y1="16" x2="60" y2="5" stroke="#ccd6ff" stroke-width="3"/><circle cx="60" cy="5" r="5" fill="#ffd54a"/>
  ${arms}
  <rect x="38" y="88" width="44" height="38" rx="16" fill="#ff8a4c"/><rect x="48" y="99" width="24" height="12" rx="5" fill="rgba(255,255,255,.3)"/>
  <rect x="40" y="122" width="15" height="14" rx="6" fill="#e8f0ff"/><rect x="65" y="122" width="15" height="14" rx="6" fill="#e8f0ff"/>
  <circle cx="60" cy="54" r="40" fill="#f4f7ff" stroke="#aab8e8" stroke-width="3"/>
  <ellipse cx="60" cy="54" rx="31" ry="27" fill="#16224f"/>
  ${eye}${mouth}
  <circle cx="40" cy="63" r="4" fill="#ff8fb1" opacity=".65"/><circle cx="80" cy="63" r="4" fill="#ff8fb1" opacity=".65"/>
  <ellipse cx="45" cy="39" rx="8" ry="4" fill="#fff" opacity=".35" transform="rotate(-30 45 39)"/></svg>`;
}

const CH=[{n:'루미',d:'용감한 우주인'},{n:'별똥이',d:'반짝반짝 별'},{n:'로보',d:'똑똑한 로봇'},{n:'달토끼',d:'달나라 토끼'}];
const cur=()=>CH[S.char]||CH[0];
function face(m,cx,cy,sp,col){
  const e=m==='happy'?`<path d="M${cx-sp-6} ${cy}q6-8 12 0M${cx+sp-6} ${cy}q6-8 12 0" stroke="${col}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`
   :m==='sad'?`<circle cx="${cx-sp}" cy="${cy+2}" r="4.2" fill="${col}"/><circle cx="${cx+sp}" cy="${cy+2}" r="4.2" fill="${col}"/><path d="M${cx-sp-6} ${cy-8}l12 5M${cx+sp+6} ${cy-8}l-12 5" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>`
   :`<circle cx="${cx-sp}" cy="${cy}" r="4.5" fill="${col}"/><circle cx="${cx+sp}" cy="${cy}" r="4.5" fill="${col}"/>`;
  const o=m==='happy'?`<path d="M${cx-9} ${cy+10}q9 11 18 0z" fill="${col}"/>`:m==='sad'?`<path d="M${cx-8} ${cy+19}q8-8 16 0" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round"/>`:`<path d="M${cx-8} ${cy+12}q8 7 16 0" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return e+o;
}
function starC(m,w){return `<svg viewBox="0 0 100 100" width="${w}" height="${w}"><polygon points="50,4 62,36 96,37 69,58 79,93 50,73 21,93 31,58 4,37 38,36" fill="#ffd54a" stroke="#ffb02e" stroke-width="4" stroke-linejoin="round"/>${face(m,50,50,10,'#3a2a00')}<circle cx="38" cy="60" r="3.5" fill="#ff8fb1" opacity=".7"/><circle cx="62" cy="60" r="3.5" fill="#ff8fb1" opacity=".7"/></svg>`;}
function robot(m,w){return `<svg viewBox="0 0 120 140" width="${w}" height="${w*140/120}"><line x1="60" y1="14" x2="60" y2="4" stroke="#ccd6ff" stroke-width="3"/><circle cx="60" cy="4" r="5" fill="#ff5c7a"/><rect x="36" y="84" width="48" height="42" rx="14" fill="#6c8cff"/><rect x="48" y="96" width="24" height="14" rx="4" fill="rgba(255,255,255,.35)"/><path d="M36 96L22 108M84 96L98 108" stroke="#c9d6ff" stroke-width="9" stroke-linecap="round"/><rect x="42" y="122" width="14" height="14" rx="5" fill="#c9d6ff"/><rect x="64" y="122" width="14" height="14" rx="5" fill="#c9d6ff"/><rect x="22" y="14" width="76" height="68" rx="20" fill="#c9d6ff" stroke="#8fa3e8" stroke-width="3"/><rect x="31" y="24" width="58" height="48" rx="13" fill="#16224f"/>${face(m,60,44,13,'#7fffd4')}</svg>`;}

function drawObj(cv,k){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height,r=rnd(k.length*131+9);
  c.fillStyle='#03040f';c.fillRect(0,0,W,H);
  const blob=(x,y,rad,col)=>{const g=c.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,rad,0,7);c.fill();};
  const dot=(x,y,s,col)=>{c.fillStyle=col;c.beginPath();c.arc(x,y,s,0,7);c.fill();};
  const bgs=n=>{for(let i=0;i<n;i++)dot(r()*W,r()*H,r()*1.1+.2,'rgba(255,255,255,'+(.3+r()*.6)+')');};
  if(k==='emis'||k==='refl'){
    const col=k==='emis'?[255,90,130]:[110,160,255];
    for(let i=0;i<16;i++)blob(W*.5+(r()-.5)*W*.6,H*.5+(r()-.5)*H*.55,W*.14+r()*W*.14,`rgba(${col[0]},${col[1]+(r()*50|0)},${col[2]},.42)`);
    blob(W*.5,H*.5,W*.1,'rgba(255,255,255,.75)');bgs(40);
  }else if(k==='dark'){
    blob(W*.5,H*.4,W*.55,'rgba(255,110,90,.5)');blob(W*.4,H*.6,W*.4,'rgba(255,150,120,.35)');bgs(60);
    c.fillStyle='rgba(6,3,12,.96)';c.beginPath();c.moveTo(W*.42,H);c.lineTo(W*.44,H*.62);c.quadraticCurveTo(W*.38,H*.36,W*.55,H*.26);c.quadraticCurveTo(W*.7,H*.28,W*.67,H*.45);c.lineTo(W*.62,H*.52);c.lineTo(W*.63,H*.66);c.lineTo(W*.64,H);c.closePath();c.fill();
  }else if(k==='open'){
    bgs(25);
    for(let i=0;i<26;i++){const x=W*.5+(r()-.5)*W*.7,y=H*.5+(r()-.5)*H*.7;blob(x,y,10,'rgba(150,190,255,.5)');dot(x,y,1.6+r()*1.6,'#dff0ff');}
  }else if(k==='glob'){
    bgs(15);blob(W/2,H/2,W*.3,'rgba(255,220,150,.35)');
    for(let i=0;i<520;i++){const a=(r()+r()+r()-1.5)/1.5,b=(r()+r()+r()-1.5)/1.5;dot(W/2+a*W*.3,H/2+b*H*.4,.6+r()*.9,'rgba(255,'+(215+(r()*30|0))+',160,'+(.5+r()*.5)+')');}
  }else{
    bgs(30);c.save();c.translate(W/2,H/2);c.rotate(-.5);
    for(let arm=0;arm<2;arm++)for(let i=0;i<380;i++){const t=i/380,rad=W*.06+t*W*.38,ang=t*3.4+arm*Math.PI;dot(Math.cos(ang)*rad+(r()-.5)*10,(Math.sin(ang)*rad+(r()-.5)*10)*.48,.6+r()*1.1,t<.4?'rgba(255,235,180,.9)':'rgba(170,200,255,.85)');}
    blob(0,0,W*.17,'rgba(255,230,160,.9)');c.restore();
  }
}

      c.fillStyle='#cfe0ff';c.beginPath();c.arc(nx,ny,5,0,7);c.fill();

function stage(i,s=0){
  const st=ST[i],stp=st.steps[s],last=s===st.steps.length-1;
  app.innerHTML=`<div class="top"><button class="back" id="bk">← 지도</button><div class="jua" style="font-size:18px">${st.ic} ${st.n}</div><div class="pill" style="font-size:12px">${s+1}/${st.steps.length}</div></div>
  <div class="dots">${st.steps.map((_,k)=>`<i class="${k<=s?'on':''}"></i>`).join('')}</div>
  <div class="lrow">${lumi(stp.m,70)}<div class="bubble">${stp.say}</div></div>
  <div class="card">${stp.mission?missionHTML(stp.mission):stp.h}<div id="wg"></div></div>${stp.mission?'<div class="card" id="dexwrap"></div>':''}
  <div class="navrow">${s>0?'<button class="btn ghost" id="pv">◀ 이전</button>':''}<button class="btn" id="nx">${last?'🚀 퀴즈 도전!':'다음 ▶'}</button></div>`;
  document.getElementById('bk').onclick=home;
  if(s>0)document.getElementById('pv').onclick=()=>stage(i,s-1);
  document.getElementById('nx').onclick=()=>last?quiz(i):stage(i,s+1);
  if(stp.w)WIDGETS[stp.w](document.getElementById('wg'));if(stp.mission)dexForm(document.getElementById('dexwrap'),i);
  scrollTo(0,0);
}

function clean(r){
  if(!r||typeof r!=='object')return null;
  const id=String(r.id||'').slice(0,8),name=String(r.name||'').slice(0,8);if(!id)return null;
  const n=x=>Number.isFinite(+x)?+x:0,I=x=>Math.max(0,n(x)|0);
  const stars=[0,1,2,3,4].map(i=>Math.min(3,I(r.stars&&r.stars[i]))),att=[0,1,2,3,4].map(i=>I(r.att&&r.att[i]));
  const qa={};if(r.qa&&typeof r.qa==='object')for(const k of Object.keys(r.qa)){const i=+k,v=r.qa[k];if(Number.isInteger(i)&&i>=0&&i<ALL.length&&Array.isArray(v))qa[i]=[I(v[0]),I(v[1])];}
  const cards=(Array.isArray(r.cards)?r.cards:[]).filter(c=>c&&typeof c==='object').slice(0,60).map(c=>({n:String(c.n||'').slice(0,20),t:String(c.t||'별').slice(0,4),m:(c.m===null||c.m===undefined||!Number.isFinite(+c.m))?null:+c.m,ly:(Number.isFinite(+c.ly)&&+c.ly>0)?+c.ly:null,note:String(c.note||'').slice(0,60),s:0}));
  return {id,name,ch:I(r.ch)%4,stars,att,qa,cards,coins:I(r.coins),fin:!!r.fin,stk:(Array.isArray(r.stk)?r.stk:[]).slice(0,16).map(x=>String(x).slice(0,4)),t:n(r.t)};
}

    while((m=re.exec(t))){try{const r=clean(JSON.parse(decodeURIComponent(escape(atob(m[1])))));if(r){imp[r.id]=r;ok++;}else bad++;}catch(e){bad++;}}
    setImp(imp);document.getElementById('imm').textContent=ok||bad?`✅ ${ok}명 가져왔어요${bad?` · 읽지 못한 코드 ${bad}개`:''}`:'붙여넣은 코드가 없어요.';
    if(ok)document.getElementById('imp').value='';tRender();
  };
  document.getElementById('tcp').onclick=()=>{
    const L=allStudents(),H=['학번','이름','★합계(15)','1단원★','2단원★','3단원★','4단원★','5단원★','코인','도감 카드','졸업','최근 활동'];
    const t=[H.join('\t')].concat(L.map(r=>[r.id,r.name,sum3(r),...r.stars,r.coins,r.cards.length,r.fin?'O':'',ago(r.t)].join('\t'))).join('\n');
    const x=document.getElementById('tx');x.innerHTML='<textarea class="ta" readonly></textarea><p class="small" id="tcm">길게 눌러 복사하거나 붙여넣어 사용하세요.</p>';
    const ta=x.querySelector('textarea');ta.value=t;ta.focus();ta.select();
    try{navigator.clipboard.writeText(t).then(()=>{document.getElementById('tcm').textContent='✅ 복사되었어요!';},()=>{});}catch(e){}
  };
  const st=t=>{const e=document.getElementById('ts');if(e)e.textContent=t;};
  if(!TDB){st('☁️ 연결 안 됨');}
  else{
    st('연결 중…');const ref=TDB.ref('students');
    const cb=sn=>{TREM=[];sn.forEach(c=>{TREM.push(Object.assign({},c.val(),{_doc:c.key}));});st('🟢 실시간 연결');tRender();};
    ref.on('value',cb,e=>{st('⚠️ 불러오기 실패');});
    TU=()=>ref.off('value',cb);
  }
  document.getElementById('rz').onclick=()=>{
    const x=document.getElementById('rzx');
    x.innerHTML='<p class="small" style="margin-top:8px">계속하려면 아래 칸에 <b>초기화</b> 라고 입력하세요.</p><input class="sq" id="rzi" placeholder="초기화"><button class="btn" id="rzg" style="background:linear-gradient(180deg,#ff8aa0,#ff3d6e);box-shadow:0 4px 0 #99183a;color:#fff">⚠️ 모든 학생 초기화 실행</button><div class="small" id="rzm"></div>';
    document.getElementById('rzg').onclick=async()=>{
      const m=document.getElementById('rzm');
      if(document.getElementById('rzi').value.trim()!=='초기화'){m.textContent='"초기화"를 정확히 입력해 주세요.';return;}
      try{await TDB.ref('students').remove();await TDB.ref('meta/resetAt').set(firebase.database.ServerValue.TIMESTAMP);setImp({});TREM=[];TSEL=null;tRender();x.innerHTML='<div class="reward">✅ 모든 학생이 초기화되었어요.</div>';}
      catch(e){m.textContent='초기화 실패: '+((e&&e.code)||'권한 또는 연결을 확인하세요');}
    };
  };
  tRender();scrollTo(0,0);
}
async function tDelete(k){
  const r=allStudents().find(x=>x.id===k);if(!r)return;
  const imp=getImp();delete imp[k];setImp(imp);
  if(r._doc&&TDB){try{await TDB.ref('students/'+r._doc).remove();TREM=TREM.filter(d=>d._doc!==r._doc);}catch(e){}}
  TSEL=null;tRender();
}
function tRender(){
  const tl=document.getElementById('tl');if(!tl)return;
  const L=allStudents(),n=L.length;
  const avg=n?(L.reduce((a,r)=>a+sum3(r),0)/n).toFixed(1):'0',grad=L.filter(r=>r.fin).length,act=L.filter(r=>Date.now()-r.t<600000).length,cards=n?(L.reduce((a,r)=>a+r.cards.length,0)/n).toFixed(1):'0';
  document.getElementById('tsum').innerHTML=`<div class="sg"><div><b>${n}</b>학생 수</div><div><b>${avg}</b>평균 ★ (15점 만점)</div><div><b>${grad}</b>졸업 완료</div><div><b>${act}</b>10분 내 활동 중</div></div><p class="small center">학생당 평균 별 도감 카드 ${cards}장</p>`;
  const q=TQ.toLowerCase(),F=L.filter(r=>!q||r.id.toLowerCase().includes(q)||r.name.toLowerCase().includes(q));
  tl.innerHTML=F.length?F.map(r=>{
    const open=TSEL===r.id;
    let det='';
    if(open){
      const wr=Object.keys(r.qa).map(k=>[+k,r.qa[k]]).filter(x=>x[1][0]>0).sort((a,b)=>b[1][0]-a[1][0]).slice(0,3);
      det=`<div class="dd" onclick="event.stopPropagation()"><table class="dtab"><tr><th>단원</th><th>별</th><th>도전</th></tr>${ST.map((s,i)=>`<tr><td>${s.ic} ${s.n}</td><td>${'★'.repeat(r.stars[i])+'☆'.repeat(3-r.stars[i])}</td><td>${r.att[i]}회</td></tr>`).join('')}</table>
      <p><b>많이 틀린 문제</b></p>${wr.length?wr.map(([i,v])=>`<p class="small">· [${ST[qStage(i)].n}] ${ALL[i].q} <b>(오답 ${v[0]}회)</b></p>`).join(''):'<p class="small">아직 틀린 문제가 없어요 👍</p>'}
      <p style="margin-top:8px"><b>📖 별 도감 카드 (${r.cards.length}장)</b></p>${r.cards.length?r.cards.map(c=>{const k=dcalc(c.m,c.ly);return `<div class="dexc" style="margin:6px 0;padding:8px 10px"><b>${TIC[c.t]||'⭐'} ${esc(c.n)}</b> <span class="small">${esc(c.t)}${c.m!==null?` · 겉보기 ${c.m}등급`:''}${c.ly?` · ${c.ly}광년`:''}${k.M!==undefined&&c.t==='별'?` · 절대 ${fnum(k.M)}`:''}</span>${c.note?`<div class="nt">📝 ${esc(c.note)}</div>`:''}</div>`;}).join(''):'<p class="small">아직 없어요.</p>'}
      <button class="del tdel" data-k="${esc(r.id)}" style="margin-top:8px">🗑 이 학생 기록 삭제</button></div>`;
    }
    return `<div class="srow ${open?'op':''}" data-k="${esc(r.id)}"><div class="sh"><span><b>${esc(r.id)}</b> ${esc(r.name)} ${r.fin?'🎓':''}</span><span class="hl">★ ${sum3(r)}/15</span></div><div class="chips">${r.stars.map((x,i)=>`<i class="sc s${x}">${i+1}</i>`).join('')}</div><div class="small">🪙 ${r.coins} · 📖 ${r.cards.length}장 · ${ago(r.t)} ${r.src}</div>${det}</div>`;
  }).join(''):'<p class="small center">아직 학생 기록이 없어요. 학생이 활동하면 여기에 나타나요.</p>';
  const agg={};for(const r of L)for(const k of Object.keys(r.qa)){const a=agg[k]||(agg[k]=[0,0]);a[0]+=r.qa[k][0];a[1]+=r.qa[k][1];}
  const top=Object.keys(agg).map(k=>[+k,agg[k]]).filter(x=>x[1][0]>0).sort((a,b)=>b[1][0]-a[1][0]).slice(0,5);
  document.getElementById('tw').innerHTML=top.length?top.map(([i,v],k)=>`<p>${k+1}. <span class="small">[${ST[qStage(i)].n}]</span> ${ALL[i].q}<br><span class="hl">오답 ${v[0]}회 · 오답률 ${Math.round(v[0]/(v[0]+v[1])*100)}%</span></p>`).join(''):'<p class="small">아직 오답 데이터가 없어요.</p>';
}

/* ---------- 화면: 정보 입력 ---------- */
function setup(first){
  let sel=S.char|0;const p=S.profile||{id:'',name:''};
  app.innerHTML=`<div class="center"><div class="logo jua" style="font-size:30px">🚀 별빛 탐험대</div><p class="sub">우주 탐험 전에 정보를 입력하고 캐릭터를 골라요!</p></div>
  <div class="card"><h3>👤 내 정보</h3><label class="fl">학번<input id="pid" inputmode="numeric" maxlength="8" placeholder="예) 30112" value="${p.id}"></label><label class="fl">이름<input id="pnm" maxlength="8" placeholder="이름을 입력하세요" value="${p.name}"></label></div>
  <div class="card"><h3>🧑‍🚀 캐릭터 선택</h3><div class="chars">${CH.map((c,i)=>`<button class="chr ${i===sel?'on':''}" data-c="${i}">${charSVG(i,'happy',66)}<b>${c.n}</b><span>${c.d}</span></button>`).join('')}</div></div>
  <div class="err" id="err"></div><button class="btn" id="go">탐험 시작! 🚀</button><button class="btn ghost" id="cn">${first?'← 역할 선택':'취소'}</button>`;
  app.querySelectorAll('.chr').forEach(b=>b.onclick=()=>{sel=+b.dataset.c;app.querySelectorAll('.chr').forEach(x=>x.classList.toggle('on',x===b));});
  document.getElementById('go').onclick=()=>{
    const id=document.getElementById('pid').value.trim(),nm=document.getElementById('pnm').value.trim(),er=document.getElementById('err');
    if(!/^\d{3,8}$/.test(id)){er.textContent='학번은 숫자 3~8자리로 입력해 주세요.';return;}
    if(!nm){er.textContent='이름을 입력해 주세요.';return;}
    S.profile={id,name:nm};S.char=sel;S.resetSeen=Math.max(S.resetSeen||0,RESET_AT);save();home();
  };
  document.getElementById('cn').onclick=first?entry:home;
  scrollTo(0,0);
}

/* ---------- 화면: 퀴즈 ---------- */
let Q=null;
function quiz(src){if(typeof src==='number'){S.att[src]=(S.att[src]||0)+1;save();}Q={src,list:src==='final'?shuf(ALL).slice(0,6):QZ[src].slice(),idx:0,wrong:0,tries:0,ans:false};qrender();}
function qrender(){
  const q=Q.list[Q.idx],opts=shuf(q.a.map((t,k)=>({t,ok:k===0}))),title=Q.src==='final'?'🏅 졸업 시험':`${ST[Q.src].ic} ${ST[Q.src].n} 퀴즈`;
  Q.tries=0;Q.ans=false;
  app.innerHTML=`<div class="top"><button class="back" id="bk">✕</button><div class="jua" style="font-size:18px">${title}</div><div class="pill" id="cn">🪙 ${S.coins}</div></div>
  <div class="prog"><i style="width:${Q.idx/Q.list.length*100}%"></i></div>
  <div class="lrow" id="lr">${lumi('normal',70)}<div class="bubble">문제 ${Q.idx+1} / ${Q.list.length} · <b>정답을 맞혀야</b> 다음으로 갈 수 있어! 맞히면 🪙 보상!</div></div>
  <div class="card"><h3 class="qq">${q.q}</h3><div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.ok?1:0}">${o.t}</button>`).join('')}</div><div id="fb"></div></div>`;
  document.getElementById('bk').onclick=home;
  const say=(m,t)=>{document.getElementById('lr').innerHTML=lumi(m,70)+`<div class="bubble">${t}</div>`;};
  app.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>{
    if(Q.ans||b.disabled)return;
    if(b.dataset.ok!=='1'){
      Q.tries++;Q.wrong++;b.classList.add('bad');b.disabled=true;{const qi=ALL.indexOf(q);(S.qa[qi]=S.qa[qi]||[0,0])[0]++;save();}
      say('sad',Q.tries>=2?'괜찮아, 힌트를 읽고 다시 도전해 봐! 💪':'앗, 오답! 다른 보기를 골라서 다시 도전해 봐 💪');
      if(Q.tries>=2)document.getElementById('fb').innerHTML=`<div class="ex">💡 힌트: ${q.e}</div>`;
      return;
    }
    Q.ans=true;b.classList.add('good');{const qi=ALL.indexOf(q);(S.qa[qi]=S.qa[qi]||[0,0])[1]++;}app.querySelectorAll('.opts .opt').forEach(x=>x.disabled=true);
    const coin=Q.tries===0?10:5,nw=STK.filter(x=>!S.stk.includes(x)),stk=Q.tries===0?(nw.length?nw[Math.random()*nw.length|0]:null):null;
    S.coins+=coin;if(stk)S.stk.push(stk);save();document.getElementById('cn').textContent='🪙 '+S.coins;
    say('happy',Q.tries===0?'한 번에 정답! 대단해! 🎉':'끝까지 해냈구나! 멋져! 👏');
    const last=Q.idx===Q.list.length-1;
    document.getElementById('fb').innerHTML=`<div class="reward">🎁 보상! 🪙 +${coin}${stk?` · 새 스티커 ${stk}`:''}${Q.tries===0?'':'<br><small>(한 번에 맞히면 🪙 10 + 스티커!)</small>'}</div><div class="ex">${q.e}</div><button class="btn" id="qn">${last?'결과 보기':'다음 문제 ▶'}</button>`;
    document.getElementById('qn').onclick=()=>{Q.idx++;Q.idx>=Q.list.length?pass():qrender();};
  });
  scrollTo(0,0);
}
function pass(){
  const s=Q.src,who=`${S.profile.id} ${S.profile.name}`;
  if(s==='final'){const first=!S.final;if(first)S.coins+=100;S.final=true;save();
    app.innerHTML=`<div class="center"><div class="badge">🏅</div><h2 class="jua" style="font-size:30px;margin:14px 0 4px;color:var(--gold)">우주 졸업을 축하해요!</h2><p><b>${esc(who)}</b> 탐험대원은<br>별의 거리부터 빅뱅까지 모든 행성을 정복했습니다 🎓</p>${first?'<div class="reward">🎁 졸업 보너스 🪙 +100</div>':''}<div class="lrow" style="justify-content:center">${lumi('happy',100)}</div></div><div class="card"><h3>📤 선생님께 제출하기</h3><p class="small">오늘 기록을 선생님께 보내요. 버튼을 눌러 나온 코드를 복사해서 선생님께 보내 주세요.</p><button class="btn ghost" id="sc2" style="margin-top:6px">📋 제출 코드 만들기</button><div id="sx2"></div></div><button class="btn" id="hm">🗺️ 지도로 돌아가기</button>`;
    document.getElementById('sc2').onclick=()=>showCode(document.getElementById('sx2'));document.getElementById('hm').onclick=home;scrollTo(0,0);return;}
  const stars=Q.wrong===0?3:Q.wrong<=2?2:1,old=S.stars[s];let bonus=0;
  if(old===0)bonus+=30;if(stars===3&&old<3)bonus+=20;
  S.stars[s]=Math.max(old,stars);S.unlocked=Math.max(S.unlocked,s+2);S.coins+=bonus;save();
  app.innerHTML=`<div class="center">${lumi('happy',110)}<h2 class="jua" style="font-size:28px;margin-top:6px">${ST[s].n} 탐험 성공! 🎉</h2><div class="bigstars">${'★'.repeat(stars)+'☆'.repeat(3-stars)}</div><p class="small">오답 ${Q.wrong}번 · ${stars===3?'완벽해요!':stars===2?'아주 잘했어요!':'다음엔 별 3개에 도전!'}</p>${bonus?`<div class="reward">🎁 행성 클리어 보너스 🪙 +${bonus}</div>`:''}</div>
  <div class="card"><h3>📌 오늘 얻은 지식</h3><p>${ST[s].sum}</p></div>
  <div class="card"><h3>📤 선생님께 제출하기</h3><p class="small">오늘 기록을 선생님께 보내요. 버튼을 눌러 나온 코드를 복사해서 선생님께 보내 주세요.</p><button class="btn ghost" id="sc2" style="margin-top:6px">📋 제출 코드 만들기</button><div id="sx2"></div></div>
  <button class="btn" id="go">${s<4?'다음 행성으로 🚀':'지도로 가서 졸업 시험 도전 🏅'}</button><button class="btn ghost" id="hm">🗺️ 지도로</button>`;
  document.getElementById('sc2').onclick=()=>showCode(document.getElementById('sx2'));document.getElementById('go').onclick=()=>s<4?stage(s+1,0):home();document.getElementById('hm').onclick=home;scrollTo(0,0);
}

if(location.hash==='#teacher'){entry();document.getElementById('e2').click();}else S.profile?home():entry();
</script>
